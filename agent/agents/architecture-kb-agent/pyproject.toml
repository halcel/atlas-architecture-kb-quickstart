[project]
name = "architecture-kb-agent"
version = "0.1.0"
description = "Architecture assistant over a Confluence knowledge base in MongoDB Atlas"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "agent-engine-runner-shared[mongodb]>=0.11.3,<1",
    "agent-engine-sdk-langgraph>=0.11.3,<1",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.4.0",
    "pymongo>=4.18.3",
]

[project.scripts]
architecture-kb-agent = "architecture_kb_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture_kb_agent"]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
