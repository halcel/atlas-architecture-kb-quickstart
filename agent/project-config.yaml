# Project-level settings go in this file.

memory:
  log_level: info
  voyage:
    model: "voyage-4-large"
    dimension: 1024
  short_term:
    embed_on_write: false
  extraction_llm:
    provider: null
    model: null
    api_key_secret: LLM_API_KEY
    base_url: null
    auth_header: null
  background_extraction:
    snapshot:
      max_messages: 20
      stale_minutes: 1
  extraction:
    enabled:
      - semantic
      - episodic
      - taxonomic
      - procedural
